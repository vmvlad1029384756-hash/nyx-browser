name: Windows installer

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - "NYX_Browser_1.0.0-dev.3.2_ThemeWidgets.zip"
      - "build-windows.ps1"
      - "windows-build/**"
      - ".github/workflows/windows-installer.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    name: Build NYX Setup.exe (Windows x64)
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: Install Inno Setup 6
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build, test and create installer
        shell: powershell
        run: .\build-windows.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NYX-Windows-x64-Setup
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-dev.3.5
          target_commitish: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          name: NYX Browser 1.0.0-dev.3.5 — Windows x64 preview
          body_path: windows-build/RELEASE_NOTES.md
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.sha256
