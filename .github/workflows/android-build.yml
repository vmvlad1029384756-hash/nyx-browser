name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37 platform and build tools
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          echo "## Android build completed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: com.nyx.browser.debug" >> "$GITHUB_STEP_SUMMARY"
          echo "- Minimum Android: API 26 (Android 8.0)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build type: debug APK for device testing only" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public release signing is not configured." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: NYX-Android-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
