rder-radius:9px;color:var(--text);padding:8px 9px;outline:none;font:12px "Segoe UI",Arial;touch-action:manipulation}.tile input:focus,.tile textarea:focus,.tile select:focus{border-color:var(--accent)}.tile textarea{min-height:92px;resize:vertical}.widget-value{font-size:27px;color:var(--accent);font-weight:850;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.2}.widget-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.timer-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.timer-fields input{min-width:0;width:100%}.widget-actions button,.small-btn{border:1px solid var(--line);background:var(--hover);color:var(--text);border-radius:8px;padding:8px 10px;font-size:11px;font-weight:700;cursor:pointer;touch-action:manipulation;min-height:36px}.widget-actions button.primary,.small-btn.primary{background:var(--accent);color:var(--ink);border-color:var(--accent)}.widget-actions button:hover,.small-btn:hover{border-color:var(--accent)}.resize-handle{position:absolute;bottom:3px;right:3px;width:18px;height:18px;cursor:nwse-resize;opacity:.8;background:linear-gradient(135deg,transparent 45%,var(--accent) 46%,var(--accent) 54%,transparent 55%,transparent 66%,var(--accent) 67%,var(--accent) 74%,transparent 75%);touch-action:none;z-index:9}
.habit-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:10px 0}.habit-day{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 2px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--muted);font-size:10px}.habit-day input{width:auto!important;accent-color:var(--accent)}.tile input[type=color]{height:42px;padding:4px}.tile input[readonly]{color:var(--soft)}.todo-row{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid var(--line)}.todo-row input{width:auto}.todo-row span{flex:1}.todo-row.done span{text-decoration:line-through;color:var(--muted)}.todo-row button{border:0;background:transparent;color:var(--muted);cursor:pointer}.calculator-display{font-size:21px;text-align:right;padding:9px;background:var(--bg);border:1px solid var(--line);border-radius:9px;color:var(--soft);font-weight:800;overflow:hidden}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:7px}.calc-grid button{padding:9px 0;border:1px solid var(--line);background:var(--hover);color:var(--text);border-radius:8px;font-weight:700;cursor:pointer}.calc-grid button.equal{background:var(--accent);color:var(--ink)}.progress{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:9px 0}.progress span{display:block;height:100%;background:var(--accent);border-radius:8px;width:0}

<body><main>
<div class="home-center">
<section class="hero"><div class="clock" id="clock">00:00:00</div><div class="date" id="date">Загрузка даты…</div></section>
<form class="search" id="searchForm"><span class="glass">⌕</span><input id="query" autocomplete="off" placeholder="Поиск в интернете или адрес сайта…"><button type="submit">Искать ↗</button></form>
</div>
</main>
<div class="action-dock"><button class="action" id="mobileSettings">⚙ Параметры</button><button class="action" id="addShortcut">＋ Ярлык</button><button class="action" id="addWidget">▦ Виджет</button><a class="action" href="games.html" style="text-decoration:none">🎮 Arcade</a><button class="action" id="resetLayout">↺ Сброс</button></div>
<section id="workspace" aria-label="Рабочая область"></section>
<div class="modal-backdrop" id="mobileSettingsBackdrop"><form class="modal" id="mobileSettingsForm"><h3>Параметры</h3><label for="mobileSearchEngine">Поисковая система</label><select id="mobileSearchEngine"><option>Google</option><option>DuckDuckGo</option><option>Bing</option><option>Brave Search</option></select><div class="modal-actions"><button type="button" id="cancelMobileSettings">Закрыть</button><button class="save" type="submit">Сохранить</button></div></form></div>
<div class="modal-backdrop" id="shortcutBackdrop"><form class="modal" id="shortcutForm"><h3 id="shortcutModalTitle">Новый ярлык</h3><label for="shortcutName">Название</label><input id="shortcutName" maxlength="40" required placeholder="Например, YouTube"><label for="shortcutUrl">Адрес сайта</label><input id="shortcutUrl" required placeholder="https://example.com"><div class="modal-actions"><button type="button" id="cancelShortcut">Отмена</button><button class="save" type="submit">Сохранить</button></div></form></div>
<div class="modal-backdrop" id="widgetBackdrop"><form class="modal" id="widgetForm"><h3>Добавить виджет</h3><label for="widgetType">Выбери виджет</label><select id="widgetType"></select><div class="modal-actions"><button type="button" id="cancelWidget">Отмена</button><button class="save" type="submit">Добавить</button></div></form></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const DEFAULT_SHORTCUTS=[{name:'YouTube',url:'https://www.youtube.com'},{name:'ChatGPT',url:'https://chatgpt.com'},{name:'Google',url:'https://www.google.com'},{name:'Gmail',url:'https://mail.google.com'}];
const SEARCH_ENGINES={Google:q=>'https://www.google.com/search?q='+encodeURIComponent(q),DuckDuckGo:q=>'https://duckduckgo.com/?q='+encodeURIComponent(q),Bing:q=>'https://www.bing.com/search?q='+encodeURIComponent(q),'Brave Search':q=>'https://search.brave.com/search?q='+encodeURIComponent(q)};
window.NYX_SEARCH_ENGINE=localStorage.getItem('nyx.pwa.searchEngine')||'Google';
function tickClock(){const now=new Date();$('clock').textContent=now.toLocaleTimeString('ru-RU',{hour12:false});$('date').textContent=now.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}tickClock();setInterval(tickClock,1000);
$('searchForm').addEventListener('submit',e=>{e.preventDefault();const q=$('query').value.trim();if(!q)return;const isUrl=/^(https?:\/\/)?[\w-]+(\.[\w-]+)+/.test(q)&&!q.includes(' ');if(isUrl){location.href=/^https?:\/\//i.test(q)?q:'https://'+q;return;}const engine=window.NYX_SEARCH_ENGINE||'Google';location.href=(SEARCH_ENGINES[engine]||SEARCH_ENGINES.Google)(q);});
const WIDGETS=[
 ['note','Быстрая заметка'],['timer','Таймер с настройкой времени'],['focus','Фокус с настраиваемой длительностью'],['calendar','Календарь'],['clock','Местное время'],['utc','Время UTC'],['world','Мировые часы'],['weather','Погода по городу'],['todo','Список задач'],['calculator','Калькулятор'],['quote','Цитата дня'],['countdown','Обратный отсчёт'],['goal','Дневная цель'],['stopwatch','Секундомер'],['random','Генератор чисел'],['links','Избранные сайты'],['dayprogress','Прогресс дня'],['battery','Заряд батареи'],['currency','Конвертер валют'],['ip','Мой IP и регион'],['network','Состояние интернета'],['habit','Трекер привычек'],['unit','Конвертер единиц'],['dice','Игральные кости'],['password','Генератор паролей'],['color','Палитра цветов'],['dailylog','Дневник дня']
];
const WIDGET_TITLES=(function(){const out={};WIDGETS.forEach(function(pair){out[pair[0]]=pair[1]});return out})();
const $widgetType=$('widgetType');WIDGETS.forEach(([value,label])=>{const o=document.createElement('option');o.value=value;o.textContent=label;$widgetType.append(o)});
const STORE_KEY='nyx.dashboard.viewport.v2';const LEGACY_STORE_KEY='nyx.dashboard.freeform.v1';let dashboard=null;let editId=null;let zCounter=20;let activeDrag=null;let activeResize=null;let suppressClickUntil=0;let dashboardBridge=null;let dashboardDirty=false;const widgetIntervals=[];
function startWidgetInterval(fn,ms){const id=setInterval(fn,ms);widgetIntervals.push(id);return id}
function clearWidgetIntervals(){while(widgetIntervals.length)clearInterval(widgetIntervals.pop())}
function safeParse(v,fallback){try{return JSON.parse(v)||fallback}catch(_){return fallback}}
function uid(){return 'nyx-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}
function localDateKey(date=new Date()){return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-')}
function migrateDashboard(value, legacy=false){if(!value||!Array.isArray(value.items))return null;value.version=2;if(legacy){const shift=Math.max(120,Math.round(window.innerHeight*.22));value.items.forEach(item=>{item.y=Math.max(0,(Number(item.y)||0)+shift)});}value.items.forEach(item=>{item.x=Number.isFinite(Number(item.x))?Number(item.x):12;item.y=Number.isFinite(Number(item.y))?Number(item.y):12;item.w=Number(item.w)|| (item.type==='shortcut'?205:250);item.h=Number(item.h)||180;item.z=Number(item.z)||1;item.data=item.data||{}});return value;}
function loadDashboard(){const current=safeParse(localStorage.getItem(STORE_KEY),null);if(current&&Array.isArray(current.items)){dashboard=migrateDashboard(current,false);return;}const legacy=safeParse(localStorage.getItem(LEGACY_STORE_KEY),null);if(legacy&&Array.isArray(legacy.items)){dashboard=migrateDashboard(legacy,true);localStorage.setItem(STORE_KEY,JSON.stringify(dashboard));return;}
 const oldShortcuts=safeParse(localStorage.getItem('nyx.shortcuts'),DEFAULT_SHORTCUTS);const oldWidgets=safeParse(localStorage.getItem('nyx.widgets'),[]);const items=[];let i=0;const cols=Math.max(1,Math.floor((window.innerWidth-32)/226));
 (Array.isArray(oldShortcuts)?oldShortcuts:DEFAULT_SHORTCUTS).forEach(x=>{items.push({id:uid(),type:'shortcut',name:x.name||'Сайт',url:x.url||'https://example.com',x:12+(i%cols)*226,y:130+Math.floor(i/cols)*110,w:205,h:78,z:++zCounter,data:{}});i++});
 (Array.isArray(oldWidgets)?oldWidgets:[]).forEach(x=>{const type=WIDGET_TITLES[x.type]?x.type:'note';items.push({id:uid(),type,name:WIDGET_TITLES[type],x:12+(i%cols)*226,y:130+Math.floor(i/cols)*205,w:260,h:type==='note'?220:180,z:++zCounter,data:x});i++});
 dashboard={version:2,items};localStorage.setItem(STORE_KEY,JSON.stringify(dashboard));}
function saveDashboard(){const raw=JSON.stringify(dashboard);localStorage.setItem(STORE_KEY,raw);dashboardDirty=true;if(dashboardBridge)dashboardBridge.saveDashboard(raw);}
function itemById(id){return dashboard.items.find(x=>x.id===id)}
function defaultPosition(){const i=dashboard.items.length;const cols=Math.max(1,Math.floor((window.innerWidth-24)/226));const col=i%cols;const row=Math.floor(i/cols);const y0=Math.min(160,Math.max(82,window.innerHeight*.18));return{x:12+col*226,y:y0+row*190};}
function createTile(item){const tile=document.createElement('article');tile.className='tile '+(item.type==='shortcut'?'shortcut-tile':'widget-tile');tile.dataset.id=item.id;tile.style.left=(Number(item.x)||0)+'px';tile.style.top=(Number(item.y)||0)+'px';tile.style.width=(item.w||205)+'px';if(item.h)tile.style.height=item.h+'px';tile.style.zIndex=item.z||1;
 if(item.type==='shortcut'){
  const main=document.createElement('a');main.className='shortcut-main';main.href=item.url;main.draggable=false;const icon=document.createElement('span');icon.className='shortcut-icon';icon.textContent=(item.name||'N').slice(0,1).toUpperCase();const words=document.createElement('div');words.style.minWidth='0';const name=document.createElement('div');name.className='shortcut-name';name.textContent=item.name;const domain=document.createElement('div');domain.className='shortcut-domain';try{domain.textContent=new URL(item.url).hostname}catch(_){domain.textContent=item.url}words.append(name,domain);main.append(icon,words);tile.append(main);const tools=makeTools(tile,item,true);tile.append(tools);
 }else{
  const head=document.createElement('div');head.className='tile-header';const h=document.createElement('h3');h.textContent=item.name||WIDGET_TITLES[item.type]||'Виджет';head.append(h);tile.append(head);const tools=makeTools(tile,item,false);tile.append(tools);const body=document.createElement('div');body.className='tile-body';tile.append(body);renderWidgetBody(body,item);
 }
 const grip=document.createElement('div');grip.className='resize-handle';grip.title='Изменить размер';tile.append(grip);enableMove(tile,item);enableResize(tile,grip,item);return tile;}
function makeTools(tile,item,isShortcut){const box=document.createElement('div');box.className='tile-tools';if(isShortcut){const edit=document.createElement('button');edit.textContent='✎';edit.title='Изменить ярлык';edit.onclick=e=>{e.stopPropagation();openShortcut(item.id)};box.append(edit);}const del=document.createElement('button');del.textContent='×';del.title='Удалить';del.onclick=e=>{e.stopPropagation();dashboard.items=dashboard.items.filter(x=>x.id!==item.id);saveDashboard();renderDashboard()};box.append(del);return box;}
function enableMove(tile,item){
 if(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches)return;
 tile.addEventListener('pointerdown',e=>{
  if(e.button!==0||e.target.closest('button,input,textarea,select,a,.resize-handle'))return;
  activeDrag={id:item.id,pointer:e.pointerId,startX:e.clientX,startY:e.clientY,baseX:Number(item.x)||0,baseY:Number(item.y)||0,moved:false};
  item.z=++zCounter;tile.style.zIndex=item.z;
  try{tile.setPointerCapture(e.pointerId)}catch(_){}
 });
}
function enableResize(tile,grip,item){
 if(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches){grip.hidden=true;return;}
 grip.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  e.stopPropagation();e.preventDefault();
  activeResize={id:item.id,pointer:e.pointerId,x:e.clientX,y:e.clientY,w:tile.offsetWidth,h:tile.offsetHeight};
  tile.classList.add('is-resizing');
  try{grip.setPointerCapture(e.pointerId)}catch(_){}
 });
}
window.addEventListener('pointermove',e=>{
 if(activeDrag&&activeDrag.pointer===e.pointerId){
  const item=itemById(activeDrag.id),tile=$('workspace').querySelector('[data-id="'+activeDrag.id+'"]');
  if(!item||!tile){activeDrag=null;return;}
  const dx=e.clientX-activeDrag.startX,dy=e.clientY-activeDrag.startY;
  if(Math.abs(dx)+Math.abs(dy)>4){activeDrag.moved=true;tile.classList.add('is-dragging');}
  if(activeDrag.moved){
   const maxX=Math.max(0,window.innerWidth-tile.offsetWidth);
   const maxY=Math.max(0,window.innerHeight-tile.offsetHeight);
   item.x=Math.max(0,Math.min(maxX,activeDrag.baseX+dx));
   item.y=Math.max(0,Math.min(maxY,activeDrag.baseY+dy));
   tile.style.left=item.x+'px';tile.style.top=item.y+'px';
   growWorkspace();
  }
 }

 else if(item.type==='habit'){const name=el('input');name.placeholder='Привычка недели';name.value=d.name||'Моя привычка';const days=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];const week=el('div','habit-week');const now=new Date();const monday=new Date(now);monday.setDate(now.getDate()-((now.getDay()+6)%7));d.checked=d.checked||{};days.forEach((day,i)=>{const date=new Date(monday);date.setDate(monday.getDate()+i);const key=date.toISOString().slice(0,10);const wrap=el('label','habit-day');const check=el('input');check.type='checkbox';check.checked=!!d.checked[key];check.onchange=()=>{d.checked[key]=check.checked;saveItemData(item,d);count.textContent=weekCount()+' / 7'};wrap.append(check,el('span','',day));week.append(wrap)});const weekCount=()=>days.reduce((total,_,i)=>{const date=new Date(monday);date.setDate(monday.getDate()+i);return total+(d.checked[localDateKey(date)]?1:0)},0);const count=el('div','widget-value',weekCount()+' / 7');name.onchange=()=>{d.name=name.value;saveItemData(item,d)};body.append(name,week,count,el('p','','Отмечай выполнение каждый день'))}
 else if(item.type==='unit'){const value=el('input');value.type='number';value.value=(d.value!=null?d.value:1);const from=el('select'),to=el('select');const units=[['mm',1000],['cm',100],['m',1],['km',0.001],['inch',39.3701],['ft',3.28084],['mile',0.000621371]];units.forEach(([u])=>{from.add(new Option(u,u));to.add(new Option(u,u))});from.value=d.from||'m';to.value=d.to||'cm';const result=el('div','widget-value','100 cm');const run=()=>{const f=units.find(x=>x[0]===from.value)[1],t=units.find(x=>x[0]===to.value)[1];const n=Number(value.value)*t/f;result.textContent=(Number.isFinite(n)?Number(n.toPrecision(7)).toString():'—')+' '+to.value;d.value=value.value;d.from=from.value;d.to=to.value;saveItemData(item,d)};from.onchange=run;to.onchange=run;value.oninput=run;body.append(value,from,to,result);run()}
 else if(item.type==='dice'){const min=el('input');min.type='number';min.step='1';min.value=(d.min!=null?d.min:1);min.placeholder='Минимум';const max=el('input');max.type='number';max.step='1';max.value=(d.max!=null?d.max:20);max.placeholder='Максимум';const value=el('div','widget-value',String((d.last!=null?d.last:'—')));const details=el('p','','Настраиваемый диапазон');const row=el('div','widget-actions');const roll=()=>{const lo=Number(min.value),hi=Number(max.value);if(!Number.isSafeInteger(lo)||!Number.isSafeInteger(hi)||lo>hi||hi-lo>Number.MAX_SAFE_INTEGER-1){details.textContent='Укажи целые безопасные числа и корректный диапазон';return}const result=lo+Math.floor(Math.random()*(hi-lo+1));d.min=lo;d.max=hi;d.last=result;saveItemData(item,d);value.textContent=String(result);details.textContent=`Диапазон: ${lo} — ${hi}`};row.append(button('Бросить',roll,true));min.onchange=()=>{d.min=Number(min.value);saveItemData(item,d)};max.onchange=()=>{d.max=Number(max.value);saveItemData(item,d)};body.append(el('p','','От'),min,el('p','','До'),max,value,row,details)}
 else if(item.type==='password'){const length=el('input');length.type='number';length.min='8';length.max='64';length.value=d.length||20;const val=el('input');val.readOnly=true;val.placeholder='Новый пароль появится здесь';const generate=()=>{const n=Math.max(8,Math.min(64,Number(length.value)||20)),chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*+-_';const bytes=new Uint8Array(n);crypto.getRandomValues(bytes);val.value=Array.from(bytes,b=>chars[b%chars.length]).join('');d.length=n;saveItemData(item,d)};const copy=button('Копировать',async()=>{if(!val.value)return;try{await navigator.clipboard.writeText(val.value)}catch(_){val.select();document.execCommand('copy')}});body.append(el('p','','Длина пароля (8–64 символа)'),length,button('Создать пароль',generate,true),val,copy)}
 else if(item.type==='color'){const picker=el('input');picker.type='color';picker.value=d.color||'var(--accent)';const hex=el('div','widget-value',picker.value.toUpperCase());picker.oninput=()=>{hex.textContent=picker.value.toUpperCase();d.color=picker.value;saveItemData(item,d)};const copy=button('Копировать HEX',async()=>{try{await navigator.clipboard.writeText(picker.value)}catch(_){}});body.append(picker,hex,copy)}
 else if(item.type==='dailylog'){const dateKey=localDateKey();const area=el('textarea');area.placeholder='Что важного произошло сегодня?';area.value=(d.entries && d.entries[dateKey])||'';area.addEventListener('input',()=>{d.entries=d.entries||{};d.entries[dateKey]=area.value;saveItemData(item,d)});body.append(el('p','',new Date().toLocaleDateString('ru-RU',{dateStyle:'full'})),area,el('p','','Запись автоматически сохраняется'))}
 else if(item.type==='links'){const links=el('div');const data=dashboard.items.filter(x=>x.type==='shortcut');data.slice(0,6).forEach(x=>{const a=el('p','', '↗ '+x.name);a.style.padding='5px 0';a.style.cursor='pointer';a.onclick=()=>location.href=x.url;links.append(a)});body.append(links)}
}
function renderDashboard(){clearWidgetIntervals();const host=$('workspace');host.querySelectorAll('.tile').forEach(x=>x.remove());dashboard.items.forEach(item=>host.append(createTile(item)));$('emptyHint').style.display=dashboard.items.length?'none':'grid';growWorkspace();}
function addItem(item){const pos=defaultPosition();dashboard.items.push({id:uid(),x:pos.x,y:pos.y,z:++zCounter,w:item.type==='shortcut'?205:(['note','weather','todo','currency','dailylog','habit'].includes(item.type)?280:250),h:item.type==='note'||item.type==='dailylog'?230:(item.type==='todo'||item.type==='currency'?250:185),data:{},...item});saveDashboard();renderDashboard();}
let editShortcutId=null;
function openShortcut(id=null){editShortcutId=id;const item=id?itemById(id):null;$('shortcutModalTitle').textContent=item?'Изменить ярлык':'Новый ярлык';$('shortcutName').value=(item && item.name)||'';$('shortcutUrl').value=(item && item.url)||'';$('shortcutBackdrop').style.display='flex';$('shortcutName').focus()}
$('mobileSettings').onclick=()=>{$('mobileSearchEngine').value=window.NYX_SEARCH_ENGINE||'Google';$('mobileSettingsBackdrop').style.display='flex'};$('cancelMobileSettings').onclick=()=>$('mobileSettingsBackdrop').style.display='none';$('mobileSettingsForm').onsubmit=e=>{e.preventDefault();window.NYX_SEARCH_ENGINE=$('mobileSearchEngine').value;localStorage.setItem('nyx.pwa.searchEngine',window.NYX_SEARCH_ENGINE);$('mobileSettingsBackdrop').style.display='none'};$('addShortcut').onclick=()=>openShortcut();$('cancelShortcut').onclick=()=>$('shortcutBackdrop').style.display='none';$('shortcutBackdrop').onclick=e=>{if(e.target===$('shortcutBackdrop'))$('shortcutBackdrop').style.display='none'};
$('shortcutForm').onsubmit=e=>{e.preventDefault();const name=$('shortcutName').value.trim();let url=$('shortcutUrl').value.trim();if(!/^https?:\/\//i.test(url))url='https://'+url;try{new URL(url)}catch(_){$('shortcutUrl').focus();return}if(editShortcutId){const item=itemById(editShortcutId);if(item){item.name=name;item.url=url}}else addItem({type:'shortcut',name,url});saveDashboard();renderDashboard();$('shortcutBackdrop').style.display='none'};
$('addWidget').onclick=()=>$('widgetBackdrop').style.display='flex';$('cancelWidget').onclick=()=>$('widgetBackdrop').style.display='none';$('widgetBackdrop').onclick=e=>{if(e.target===$('widgetBackdrop'))$('widgetBackdrop').style.display='none'};$('widgetForm').onsubmit=e=>{e.preventDefault();const type=$('widgetType').value;addItem({type,name:WIDGET_TITLES[type]||'Виджет'});$('widgetBackdrop').style.display='none'};
$('resetLayout').onclick=()=>{if(!confirm('Сбросить расположение всех карточек? Сами ярлыки и виджеты останутся.'))return;const cols=Math.max(1,Math.floor((window.innerWidth-24)/226));dashboard.items.forEach((x,i)=>{x.x=12+(i%cols)*226;x.y=Math.min(160,Math.max(82,window.innerHeight*.18))+Math.floor(i/cols)*190;x.z=i+1});zCounter=dashboard.items.length+10;saveDashboard();renderDashboard()};
loadDashboard();zCounter=Math.max(zCounter,...dashboard.items.map(x=>Number(x.z)||0));renderDashboard();
function fitTilesToViewport(persist=true){let changed=false;dashboard.items.forEach(item=>{const node=$('workspace').querySelector('[data-id="'+item.id+'"]');if(!node)return;const maxX=Math.max(0,window.innerWidth-node.offsetWidth);const maxY=Math.max(0,window.innerHeight-node.offsetHeight);const nextX=Math.max(0,Math.min(maxX,Number(item.x)||0));const nextY=Math.max(0,Math.min(maxY,Number(item.y)||0));if(nextX!==item.x||nextY!==item.y){item.x=nextX;item.y=nextY;changed=true}node.style.left=item.x+'px';node.style.top=item.y+'px'});if(changed&&persist)saveDashboard()}
window.addEventListener('resize',()=>fitTilesToViewport(true));requestAnimationFrame(()=>fitTilesToViewport(false));
window.addEventListener('pagehide',()=>saveDashboard());
