<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090811"><title>NYX Home</title>
<style>
:root{color-scheme:dark;--bg:#090811;--panel:#141222;--line:#302a40;--accent:#a98bff;--muted:#a29bb6;--text:#f5f2ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 34%,#211c31,var(--bg) 68%);color:var(--text);font:16px system-ui,sans-serif}
main{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:32px 18px 48px}section{width:min(680px,100%);text-align:center}
.logo{font-weight:950;font-size:clamp(56px,17vw,88px);letter-spacing:-.09em;color:var(--accent);text-shadow:0 14px 50px #7654df55}
.tag{color:var(--muted);font-size:12px;letter-spacing:.22em;margin:0 0 32px}
form{display:flex;gap:8px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:17px;box-shadow:0 18px 60px #0008}
input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font:inherit;padding:8px 10px}
button{border:0;border-radius:12px;background:var(--accent);color:#160e2b;font-weight:800;padding:0 18px;min-height:46px}
.links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:22px}
a{padding:14px 8px;border:1px solid var(--line);border-radius:13px;background:#141222;color:#d9ceff;text-decoration:none;font-weight:700}
a:active,button:active{transform:scale(.98)}.note{margin-top:34px;color:#756d87;font-size:11px}
</style>
</head>
<body><main><section>
<div class="logo">N.</div><p class="tag">BROWSE BEYOND</p>
<form action="https://www.google.com/search" method="get">
<input name="q" type="search" placeholder="Поиск или адрес сайта…" aria-label="Поиск или адрес сайта" autocomplete="off">
<button type="submit">Найти</button></form>
<nav class="links" aria-label="Быстрые ссылки">
<a href="https://nyx-browser.pages.dev/">NYX Website</a><a href="https://www.youtube.com/">YouTube</a><a href="https://github.com/">GitHub</a>
</nav><p class="note">Твоя стартовая страница остаётся доступной без интернета.</p>
</section></main></body></html>
